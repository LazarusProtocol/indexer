name: lazarus-indexer

services:
  postgres:
    image: postgres:16-alpine
    container_name: lazarus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lazarus_db}
      POSTGRES_USER: ${POSTGRES_USER:-lazarus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazarus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lazarus} -d ${POSTGRES_DB:-lazarus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lazarus-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lazarus-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lazarus-net
    restart: unless-stopped

  indexer:
    container_name: lazarus-indexer
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate --noinput &&
             gunicorn lazarus_indexer.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers ${GUNICORN_WORKERS:-2} --timeout 60"
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-lazarus-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-lazarus_db}
      POSTGRES_USER: ${POSTGRES_USER:-lazarus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazarus}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      CELERY_TASK_ALWAYS_EAGER: ${CELERY_TASK_ALWAYS_EAGER:-false}
      LAZARUS_VAULT_CONTRACT_ID: ${LAZARUS_VAULT_CONTRACT_ID:-CCWAH7BVPGYOEBPRFWPZIONBYUCCQH7OARGZLOD6ZV66SOAFBVA2DHD5}
      LAZARUS_SOROBAN_RPC_URL: ${LAZARUS_SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      LAZARUS_ATTESTATION_ENCLAVE_URL: ${LAZARUS_ATTESTATION_ENCLAVE_URL:-http://host.docker.internal:8085}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${INDEXER_PORT:-8000}:8000"
    networks:
      - lazarus-net
    restart: unless-stopped

  celery-worker:
    container_name: lazarus-celery-worker
    build: .
    command: ["celery", "-A", "lazarus_indexer", "worker", "-l", "info", "--concurrency=2"]
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-lazarus-dev-secret-key-change-in-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-lazarus_db}
      POSTGRES_USER: ${POSTGRES_USER:-lazarus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lazarus}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/0}
      LAZARUS_VAULT_CONTRACT_ID: ${LAZARUS_VAULT_CONTRACT_ID:-CCWAH7BVPGYOEBPRFWPZIONBYUCCQH7OARGZLOD6ZV66SOAFBVA2DHD5}
      LAZARUS_SOROBAN_RPC_URL: ${LAZARUS_SOROBAN_RPC_URL:-https://soroban-testnet.stellar.org}
      LAZARUS_ATTESTATION_ENCLAVE_URL: ${LAZARUS_ATTESTATION_ENCLAVE_URL:-http://host.docker.internal:8085}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - lazarus-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  lazarus-net:
    driver: bridge
